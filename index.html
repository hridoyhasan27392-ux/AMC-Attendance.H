<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c69">
  <meta name="description" content="AMC Economics Department Attendance Management System">

  <title>AMC Economics Attendance</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">AMC</div>
      <div>
        <h1>AMC Economics</h1>
        <p>Attendance Management System</p>
      </div>
    </div>

    <button type="button" id="themeBtn" class="ghost">
      🌙 থিম
    </button>
  </header>

  <main class="wrap">
    <div id="setupNotice" class="notice hidden"></div>

    <section id="loginCard" class="panel auth">
      <h2>লগইন করুন</h2>
      <p class="muted">
        অনুমোদিত অ্যাকাউন্ট দিয়ে প্রবেশ করুন।
      </p>

      <form id="loginForm">
        <label for="email">
          ইমেইল
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >
        </label>

        <label for="password">
          পাসওয়ার্ড
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button type="submit" class="primary">
          লগইন
        </button>

        <p id="loginMsg" class="message" role="status"></p>
      </form>

      <p class="small">
        অ্যাকাউন্ট না থাকলে অনুমোদিত অ্যাডমিনের সঙ্গে যোগাযোগ করুন।
      </p>
    </section>

    <section id="app" class="hidden">
      <div class="panel welcome">
        <div>
          <h2 id="welcomeTitle">স্বাগতম</h2>
          <p id="userLine" class="muted"></p>
        </div>

        <button type="button" id="logoutBtn" class="danger">
          লগআউট
        </button>
      </div>

      <nav id="nav" class="nav" aria-label="প্রধান মেনু"></nav>

      <section id="view" class="panel" aria-live="polite">
        <p>লোড হচ্ছে…</p>
      </section>
    </section>
  </main>

  <footer>
    AMC Economics Department<br>
    Attendance Management System
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="./config.js"></script>
  <script src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(function (error) {
            console.error("Service Worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
