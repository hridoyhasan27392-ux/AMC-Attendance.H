<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123c69">
  <title>AMC Attendance</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">AMC</div><div><h1>AMC Attendance</h1><p>আনন্দ মোহন কলেজ</p></div></div>
  <button id="themeBtn" class="ghost" type="button">🌙 থিম</button>
</header>
<main class="wrap">
  <section id="setupNotice" class="notice hidden"></section>
  <section id="loginCard" class="panel auth">
    <h2>অ্যাকাউন্টে প্রবেশ</h2>
    <p class="muted">অ্যাডমিন, শিক্ষক বা শিক্ষার্থীর নিবন্ধিত ইমেইল ব্যবহার করুন।</p>
    <form id="loginForm">
      <label>ইমেইল<input id="email" type="email" autocomplete="username" required placeholder="name@example.com"></label>
      <label>পাসওয়ার্ড<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="পাসওয়ার্ড"></label>
      <button class="primary" type="submit">লগইন</button>
    </form>
    <p id="loginMsg" class="message" role="status"></p>
  </section>
  <section id="app" class="hidden">
    <div class="welcome panel">
      <div><h2 id="welcomeTitle">ড্যাশবোর্ড</h2><p id="userLine" class="muted"></p></div>
      <button id="logoutBtn" class="danger" type="button">লগআউট</button>
    </div>
    <nav id="nav" class="nav"></nav>
    <section id="view" class="panel"></section>
  </section>
  <footer>AMC Attendance · নিরাপদ ব্যবহারের জন্য নিজের অ্যাকাউন্ট থেকে লগআউট করুন।</footer>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
