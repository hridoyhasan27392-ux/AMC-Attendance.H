<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Economica AMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a8a;--primary-d:#0f1f55;--primary-l:#e8edfa;
  --gold:#c99a2e;--gold-l:#faf0d9;--gold-t:#7a5a10;
  --red:#b3261e;--red-l:#fbe9e7;
  --bg:#f2f4fa;--card:#fff;--text:#141a33;--muted:#5b6485;--line:#e1e6f2;--soft:#f2f4fa;
  --radius:20px;--shadow:0 2px 10px rgba(15,31,85,.10);
}
[data-theme="dark"]{
  --primary:#4f74d9;--primary-d:#0a1230;--primary-l:#1a2a55;
  --gold-l:#3a3015;--gold-t:#e6c36a;--red-l:#3b1f1c;--red:#ff8a80;
  --bg:#0b1020;--card:#131a30;--text:#e8ecf8;--muted:#9aa6c7;--line:#25304f;--soft:#1a2340;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding-bottom:84px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);border-top:4px solid var(--primary)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{width:48px;height:48px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:20px;color:var(--primary);font-weight:700;line-height:1.2;font-family:'Inter','Noto Sans Bengali',sans-serif}
.brand small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:600;color:var(--primary);background:var(--card)}
.hbtn.icon{padding:10px;width:44px;height:44px;display:grid;place-items:center}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:linear-gradient(135deg,var(--primary-d),var(--primary));color:#fff;padding:28px 0 70px}
.hero .eyebrow{font-size:14px;opacity:.85}
.hero h1{font-size:40px;line-height:1.25;margin:6px 0 10px;font-weight:700}
.hero p{font-size:16px;opacity:.9}
.hero.lite{padding-bottom:64px}
.hero.lite h1{font-size:34px}
.datepill{display:inline-block;margin-top:16px;background:rgba(255,255,255,.16);padding:9px 18px;border-radius:30px;font-weight:600;font-size:14.5px}
.cta{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--text);border-radius:var(--radius);padding:16px;margin-top:22px;box-shadow:var(--shadow);width:100%;text-align:left}
.cta .ib{width:52px;height:52px;border-radius:14px;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;flex:none}
.cta b{display:block;font-size:19px;color:var(--primary)}
.cta span{font-size:13.5px;color:var(--muted)}
.cta .go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.cta .ib .ic,.cta .go .ic{width:24px;height:24px}
.linkc{display:block;text-align:center;color:#fff;font-weight:600;margin-top:14px;text-decoration:none}

/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
.pull{margin-top:-46px;position:relative}
.stack>*+*{margin-top:16px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.row-h h2{font-size:22px}
.pill{background:var(--gold-l);color:var(--gold-t);font-weight:600;font-size:13px;padding:5px 12px;border-radius:20px;white-space:nowrap}
.more{color:var(--primary);font-weight:700;text-decoration:none;font-size:15px}

/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:30px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cnt{background:var(--soft);color:var(--text);border-radius:12px;padding:0 8px;font-size:13px;min-width:24px;text-align:center}
.chip.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.chip.day{padding:8px 14px;font-size:14px}

/* class rows */
.crow{display:flex;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.crow .tm{width:112px;flex:none}
.crow .tm b{display:block;color:var(--primary);font-size:15px}
.crow .tm small{color:var(--muted);font-size:12.5px;display:block}
.crow .ds b{display:block;font-size:17px;font-family:'Inter','Noto Sans Bengali',sans-serif}
.crow .ds small{color:var(--muted);font-size:14px;font-family:'Inter','Noto Sans Bengali',sans-serif}
.crow.past{opacity:.5}
.crow.now{background:var(--primary-l);border-radius:14px;border-top-color:transparent}
.badge-now{display:inline-block;background:var(--primary);color:#fff;font-size:11.5px;padding:1px 9px;border-radius:12px;margin-left:8px;vertical-align:middle;font-family:'Noto Sans Bengali',sans-serif}
.empty{text-align:center;color:var(--muted);padding:26px 0}

/* notices */
.nitem{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.nitem:first-of-type{border-top:0}
.dbox{width:62px;height:62px;border-radius:16px;background:var(--primary-l);color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.2}
.dbox b{font-size:24px}.dbox span{font-size:13px;font-weight:600}
.nitem h3{font-size:17px;line-height:1.45}
.meta{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--soft);border-radius:14px;padding:2px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);margin-bottom:12px}
.search:focus,.field:focus{outline:2px solid var(--primary);outline-offset:1px}
.demo{background:var(--gold-l);color:var(--gold-t);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}

/* attendance */
.seg{display:flex;background:var(--soft);border-radius:18px;padding:5px;margin-bottom:20px;border:1px solid var(--line)}
.seg button{flex:1;padding:12px;border-radius:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:30px;padding:5px 14px 5px 5px;font-weight:600;font-size:14px;color:var(--muted)}
.st i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px}
.st.on{background:var(--primary-l);color:var(--text)}.st.on i{background:var(--primary);color:#fff}
.st.ok i{background:var(--primary);color:#fff}
.card h3.q{font-size:26px;margin-bottom:4px}
.muted{color:var(--muted)}
.pinbox{display:flex;gap:12px;justify-content:center;margin:24px 0}
.pinbox input{width:64px;height:76px;border-radius:18px;border:2px solid var(--line);background:var(--soft);text-align:center;font-size:30px;font-weight:700}
.pinbox input:focus{border-color:var(--primary);outline:4px solid var(--primary-l);background:var(--card)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-weight:700;font-size:18px;text-align:center;text-decoration:none}
.btn:disabled{background:#9aa9d6;cursor:not-allowed}
.btn.ghost{background:var(--primary-l);color:var(--primary);margin-top:10px}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:15px}
.field{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);margin:6px 0 14px}
label.lb{font-weight:600;font-size:14.5px}
.err{background:var(--red-l);color:var(--red);padding:10px 14px;border-radius:12px;font-weight:600;margin:12px 0;font-size:14.5px}
.info{background:var(--primary-l);padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14.5px}
.note{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.success{text-align:center;padding:10px 0}
.success .big{width:84px;height:84px;border-radius:50%;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.success .big .ic{width:46px;height:46px;stroke-width:2.4}
.tiny{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

/* my attendance */
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 0 14px}
.who h3{font-size:22px}
.ringcard{display:flex;align-items:center;gap:22px;border-radius:22px;padding:22px;background:var(--gold-l)}
.ringcard.good{background:var(--primary-l)}.ringcard.bad{background:var(--red-l)}
.ring{width:128px;height:128px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.ringcard .rt b{font-size:30px}.ringcard .rt small{font-size:17px;color:var(--muted)}
.ringcard .rt div{font-weight:700;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.tile{border-radius:18px;text-align:center;padding:16px 6px;font-weight:600}
.tile b{display:block;font-size:30px;line-height:1.2}
.tile.p{background:var(--primary-l);color:var(--primary)}.tile.l{background:var(--gold-l);color:var(--gold-t)}.tile.a{background:var(--red-l);color:var(--red)}
.sub{font-size:20px;margin:22px 0 8px}
.crs{padding:12px 0;border-top:1px solid var(--line)}
.crs .top2{display:flex;justify-content:space-between;font-weight:600;gap:10px}
.bar{height:9px;border-radius:6px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:6px}
.bar i.warn{background:var(--gold)}.bar i.low{background:var(--red)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hrow b{display:block;font-size:17px}.hrow small{color:var(--muted)}
.st-chip{padding:5px 16px;border-radius:20px;font-weight:700;font-size:14px}
.st-chip.p{background:var(--primary-l);color:var(--primary)}.st-chip.l{background:var(--gold-l);color:var(--gold-t)}.st-chip.a{background:var(--red-l);color:var(--red)}

/* footer, nav */
footer.foot{background:var(--primary-d);color:#fff;margin-top:34px;padding:30px 0}
footer.foot b.t{font-size:24px;font-family:'Inter',sans-serif}
footer.foot p{opacity:.85;margin-top:10px}
footer.foot p.s{opacity:.65;font-size:14.5px}
footer.foot a{color:#fff;font-weight:700;text-decoration:none;display:inline-block;margin-top:14px}
.panel-link{text-align:center;margin-top:18px;color:var(--muted)}
.panel-link a{font-weight:700}
nav.bar-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bar-nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav.bar-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600}
nav.bar-nav a.on{color:var(--primary)}
nav.bar-nav .ic{width:28px;height:28px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:24px 20px 28px;max-height:85vh;overflow:auto}
.modal h3{font-size:21px;line-height:1.45;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0f1f55;color:#fff;padding:12px 20px;border-radius:14px;z-index:70;font-weight:600;max-width:90%;text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}


/* links, faculty */
.lk{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.lk:first-of-type{border-top:0}
.lk .ib2{width:46px;height:46px;border-radius:14px;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;flex:none}
.lk b{display:block;font-size:17px;color:var(--primary)}
.lk span{font-size:13.5px;color:var(--muted);word-break:break-all}
.lk .ar{margin-left:auto;color:var(--muted);font-weight:700}
.fcard{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.fcard:first-of-type{border-top:0}
.av{width:56px;height:56px;border-radius:50%;background:var(--primary-l);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;overflow:hidden;font-family:'Inter',sans-serif}
.av{position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
.fcard h3{font-size:17px;line-height:1.35;font-family:'Inter','Noto Sans Bengali',sans-serif}
.fcard small{color:var(--muted);font-size:14px}
.hd{display:inline-block;background:var(--gold-l);color:var(--gold-t);font-size:12px;font-weight:700;padding:1px 10px;border-radius:12px;margin-left:6px;vertical-align:middle;font-family:'Noto Sans Bengali',sans-serif}
.fl{margin-left:auto;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.livebar{background:var(--primary-l);color:var(--primary);border-radius:14px;padding:9px 14px;font-size:13.5px;margin-bottom:14px;font-weight:600}


.tcard{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.tcard:first-of-type{border-top:0}
.tcard.feat{border:1.5px solid var(--primary-l);background:linear-gradient(135deg,var(--primary-l),transparent);border-radius:18px;padding:16px}
.tcard .av{width:84px;height:84px;font-size:26px;border:3px solid var(--card);box-shadow:0 2px 8px rgba(15,31,85,.18)}
.tinfo{min-width:0;flex:1}
.tinfo h3{font-size:18px;line-height:1.3;font-family:'Inter','Noto Sans Bengali',sans-serif}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tags .hd{margin-left:0}
.hd.b{background:var(--primary-l);color:var(--primary)}
.callbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:7px 14px;font-weight:700;color:var(--primary);text-decoration:none;background:var(--card)}
.callbtn .ic{width:18px;height:18px}
.tinfo .fl{display:block;margin:6px 0 0;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;padding:18px 8px}
.stat b{display:block;font-size:32px;color:var(--primary);line-height:1.25}
.stat.g b{color:var(--gold)}
.stat span{color:var(--muted);font-size:14.5px}
.yb{padding:14px 0;border-top:1px solid var(--line)}
.yb:first-of-type{border-top:0}
.yb .top2{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.sbar{display:flex;height:22px;border-radius:12px;overflow:hidden;margin:10px 0 8px}
.sbar i{background:var(--primary)}.sbar u{background:var(--gold);text-decoration:none}
.yb .lg2{display:flex;justify-content:space-between;color:var(--muted);font-size:14.5px}
.qcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.qcard b{display:block;font-size:20px;color:var(--primary)}
.qcard span{color:var(--muted);font-size:15px}
.hist{line-height:1.8;font-size:16px}

@media (min-width:760px){
  .hero h1{font-size:48px}
  body{padding-bottom:90px}
}
@media print{
  header.top,nav.bar-nav,footer.foot,.hero,.no-print,.chips{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .pull{margin-top:0}.card{box-shadow:none;border:0}
  .print-title{display:block!important}
}
.print-title{display:none;font-size:22px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 3 56 11v20c0 15-10 26-24 30C18 57 8 46 8 31V11z" fill="#1e3a8a"/>
      <path d="M32 8 51 14v17c0 12-8 21-19 25C21 52 13 43 13 31V14z" fill="#fff"/>
      <circle cx="32" cy="29" r="9" fill="none" stroke="#b3261e" stroke-width="3"/>
      <circle cx="32" cy="29" r="3" fill="#b3261e"/>
      <path d="M20 44h24" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="brand"><b>Economica AMC</b><small id="appSub"></small></div>
    <button class="hbtn icon" id="themeBtn" data-act="theme" aria-label="Theme"></button>
    <button class="hbtn" id="langBtn" data-act="lang"></button>
  </div>
</header>

<main id="app"></main>

<nav class="bar-nav" id="nav"></nav>
<div id="overlay"></div>

<script>
(function(){
'use strict';

/* ================= CONFIG & DEMO DATA =================
   DEMO = true  -> নমুনা তথ্য ও ডেমো PIN চালু।
   Phase 2-3: নোটিশ/রুটিন স্বয়ংক্রিয় সংগ্রহ থেকে আসবে।
   Phase 4-6: PIN যাচাই ও হাজিরা Firebase + server function দিয়ে হবে। */
const DEMO = true;
const COLLEGE_NOTICE_URL = 'https://www.anandamohangovtcollege.edu.bd/home/notice';
const COLLEGE_URL = 'https://www.anandamohangovtcollege.edu.bd/';
// সংযুক্ত দুটি ওয়েবসাইট
const LINKS = {
  college: 'https://www.anandamohangovtcollege.edu.bd/home/department?department=MTU=',
  attendance: 'https://amc-economics.vercel.app/'
};
/* স্বয়ংক্রিয় আপডেট: সাইটটি Vercel-এ ডিপ্লয় করলে /api/college নিজে থেকে কাজ করে।
   GitHub Pages-এ রাখলে API_BASE-এ Vercel সাইটের ঠিকানা দিন, যেমন 'https://amc-xxxx.vercel.app'।
   সংযোগ না পেলে নিচের সংরক্ষিত (কলেজের সাইট থেকে নেওয়া) তথ্যই দেখানো হয়। */
const API_BASE = '';
const LIVE_API = API_BASE + '/api/college';

const GROUPS = [
  { key:'y1', session:'2025-26', courses:[['Basic Macroeconomics','Sanjida Begum'],['Basic Statistics','Md. Moshiul Alam'],['Principles of Microeconomics','Md. Ahsan Habib'],['Bangladesh Economy','Md. Momen Hossain']], room:'201', per:2 },
  { key:'y2', session:'2024-25', courses:[['Intermediate Microeconomics','Qudrat Hayat'],['Intermediate Macroeconomics','Mohammad Shajahan Karim'],['Mathematical Economics','Md. Nazmul Hoda'],['Economic History','Md. Arif Billah']], room:'202', per:2 },

/* ================= ATTENDANCE DATA ================= */
function hash(a,b){ let x=Math.imul(a|0,73856093)^Math.imul(b|0,19349663); x=Math.imul(x^(x>>>13),1274126177); return ((x^(x>>>16))>>>0)%100; }
function baseRecords(session, roll){
  const gi=groupOfSession(session); if(gi<0) return [];
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  for(let i=1;i<=35;i++){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const wd=d.getDay(); if(wd>4) continue;
    classesFor(gi,wd).slice(0,1).forEach(c=>{
      const r=hash(Number(roll)*31+gi, i);
      out.push({date:iso(d), course:c.course, status: r<72?'p':r<80?'l':'a'});
    });
  }
  return out;
}
const localRecs = () => store.get('amc_att',[]);
function getRecords(session, roll){
  const mine=localRecs().filter(r=>r.session===session && String(r.roll)===String(roll)).map(r=>({date:r.date,course:r.course,status:r.status}));
  return baseRecords(session,roll).concat(mine).sort((a,b)=>b.date.localeCompare(a.date));
}

function classRow(c, isToday){

  <div class="wrap stack" style="margin-top:-34px;position:relative">
    <div class="card"><div class="row-h"><h2>${T('today')}</h2>${knownDay(day)?`<span class="pill">${T('totalCls',n(total))}</span>`:''}</div><div class="chips">${tabs}</div>${rows}${!S.live?`<div class="demo" style="margin-top:12px">${T('demoNote')}</div>`:''}</div>
    <div class="card"><div class="row-h"><h2>${T('latest')}</h2><a class="more" href="#/notices">${T('all')}</a></div>${NOTICES.slice(0,3).map(noticeItem).join('')}</div>
    ${quickCards()}${linksCard()}
  </div>${footer()}`;
}

function routineView(){
  const today=new Date().getDay();
  if(S.rDay===null) S.rDay = today<=4?today:0;
  const tabs = GROUPS.map((g,i)=>`<button class="chip ${i===S.rYear?'on':''}" data-act="ryear" data-i="${i}">${T('yr')[i]}</button>`).join('');
  const days = T('days').map((d,i)=>`<button class="chip day ${i===S.rDay?'on':''}" data-act="rday" data-i="${i}">${d}</button>`).join('');
  const list = classesFor(S.rYear,S.rDay);
  const rows = dayBlock(S.rYear,S.rDay,S.rDay===today);
  return `${hero(T('routineT'),T('routineS'),true)}<div class="wrap stack pull"><div class="card">
    <div class="print-title">${T('printTitle')} — ${T('yr')[S.rYear]}</div>
    <div class="chips no-print">${tabs}</div><div class="chips no-print">${days}</div>${rows}
    ${!S.live?`<div class="demo" style="margin-top:12px">${T('demoNote')}</div>`:''}
    <div class="actions no-print"><button class="btn sm" data-act="print">${T('print')}</button><a class="btn sm ghost" style="margin-top:0" href="${COLLEGE_URL}" target="_blank" rel="noopener">${T('official')}${EXT}</a></div>
  </div></div>${footer()}`;
}

function noticesView(){
  const years=[...new Set(NOTICES.map(x=>x.d.slice(0,4)))].sort().reverse();
  const q=S.nQuery.trim().toLowerCase();
  const list=NOTICES.filter(x=>(S.nYear==='all'||x.d.startsWith(S.nYear)) && (!q||x.t.toLowerCase().includes(q)));
  const chips=[`<button class="chip day ${S.nYear==='all'?'on':''}" data-act="nyear" data-v="all">${T('allYears')}</button>`].concat(years.map(y=>`<button class="chip day ${S.nYear===y?'on':''}" data-act="nyear" data-v="${y}">${n(y)}</button>`)).join('');
  return `${hero(T('noticesT'),T('noticesS'),true)}<div class="wrap stack pull"><div class="card">
    <input class="search" id="nsearch" type="search" placeholder="${T('search')}" value="${esc(S.nQuery)}"><div class="chips">${chips}</div>
    ${liveBar()}${!S.live?`<div class="demo">${T('demoNote')}</div>`:''}
    <div id="nlist">${list.length?list.map(noticeItem).join(''):`<div class="empty">${T('noResult')}</div>`}</div>
  </div></div>${footer()}`;
}

function sessionOptions(sel){
  return GROUPS.map(g=>`<option value="${g.session}" ${g.session===sel?'selected':''}>${g.session} (${T('yr')[GROUPS.indexOf(g)]})</option>`).join('');
}
function stepper(){
  const names=[T('s1'),T('s2'),T('s3')];
  return `<div class="steps">${names.map((nm,i)=>`<div class="st ${S.step===i+1?'on':''} ${S.step>i+1?'ok':''}"><i>${n(i+1)}</i>${nm}</div>`).join('')}</div>`;
}
function giveView(){
  const err = S.err?`<div class="err">${S.err}</div>`:'';
  if(S.step===1) return `${stepper()}<h3 class="q">${T('enterPin')}</h3><p class="muted">${T('enterPinS')}</p>
    <div class="pinbox" id="pinbox">${[0,1,2,3].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" data-i="${i}" aria-label="PIN ${i+1}">`).join('')}</div>${err}
    <button class="btn" id="pinBtn" data-act="pinnext" disabled>${T('next')}</button>
    <p class="note">${T('multi')}</p>${DEMO?`<div class="demo" style="margin-top:14px">${T('demoPin')}</div>`:''}`;
  if(S.step===2){
    const g=GROUPS[S.pinInfo.g], c=g.courses[S.pinInfo.course];
    return `${stepper()}<h3 class="q">${T('yourRoll')}</h3>
      <div class="info"><b>${T('classInfo')}:</b> ${esc(c[0])} · ${esc(c[1])}</div>
      <label class="lb" for="sess">${T('session')}</label><select class="field" id="sess">${sessionOptions(S.session)}</select>
      <label class="lb" for="roll">${T('roll')}</label><input class="field" id="roll" type="number" inputmode="numeric" min="1" max="300" value="${esc(S.roll)}" placeholder="${S.lang==='bn'?'যেমন: ২৬৩':'e.g. 263'}">${err}
      <button class="btn" data-act="confirm">${T('confirm')}</button><button class="btn ghost" data-act="backpin">${T('back')}</button>`;
  }
  return `${stepper()}<div class="success"><div class="big">${ICON.check}</div><h3 class="q">${T('doneT')}</h3><p class="muted">${T('doneS',n(S.done.roll),esc(S.done.course))}</p></div>${DEMO?`<div class="demo" style="margin-top:14px">${T('attDemoDone')}</div>`:''}
    <button class="btn" data-act="another">${T('another')}</button><button class="btn ghost" data-act="finish">${T('finish')}</button>`;
}
function mineView(){
  const form = `<div class="no-print"><label class="lb" for="msess">${T('session')}</label><select class="field" id="msess">${sessionOptions(S.mySession)}</select>
    <label class="lb" for="mroll">${T('roll')}</label><input class="field" id="mroll" type="number" inputmode="numeric" min="1" max="300" value="${esc(S.myRoll)}" placeholder="${S.lang==='bn'?'যেমন: ২৬৩':'e.g. 263'}">
    ${S.err?`<div class="err">${S.err}</div>`:''}<button class="btn" data-act="showmine">${T('view')}</button></div>`;
  if(!S.mine) return `${form}<p class="note">${T('enterMine')}</p>`;
  const {session,roll}=S.mine, gi=groupOfSession(session), recs=getRecords(session,roll);
  const p=recs.filter(r=>r.status==='p').length, l=recs.filter(r=>r.status==='l').length, a=recs.filter(r=>r.status==='a').length, tot=recs.length;
  const pct = tot? Math.round((p+l)/tot*1000)/10 : 0;
  const cls = pct>=90?'good':pct>=75?'good':pct>=60?'':'bad';
  const msg = pct>=90?T('great'):pct>=75?T('ok'):T('warn');
  const C=2*Math.PI*52, col = pct>=75?'var(--primary)':pct>=60?'var(--gold)':'var(--red)';
  const byC={}; recs.forEach(r=>{ (byC[r.course]=byC[r.course]||{t:0,pr:0}).t++; if(r.status!=='a') byC[r.course].pr++; });
  const crs=Object.keys(byC).map(k=>{ const v=byC[k], pc=Math.round(v.pr/v.t*100); return `<div class="crs"><div class="top2"><span>${esc(k)}</span><span>${n(pc)}%</span></div><div class="bar"><i class="${pc>=75?'':pc>=60?'warn':'low'}" style="width:${pc}%"></i></div></div>`; }).join('');
  const lab={p:T('present'),l:T('late'),a:T('absent')};
  const hist=recs.slice(0,15).map(r=>`<div class="hrow"><div><b>${esc(r.course)}</b><small>${fshort(parse(r.date))}, ${n(r.date.slice(0,4))}</small></div><span class="st-chip ${r.status}">${lab[r.status]}</span></div>`).join('');
  return `${form}<div class="who" style="margin-top:22px"><div><h3>${S.lang==='bn'?'রোল':'Roll'} ${n(roll)}</h3><span class="muted">${T('yr')[gi]} · ${T('session')} ${n(session)}</span></div></div>
   <div class="ringcard ${cls}"><div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="rgba(120,120,100,.2)" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><b>${n(pct)}%</b></div>
   <div class="rt"><b>${n(p+l)}</b> <small>/ ${T('classes',n(tot))}</small><div style="color:${col}">${msg}</div></div></div>
   <div class="tiles"><div class="tile p"><b>${n(p)}</b>${T('present')}</div><div class="tile l"><b>${n(l)}</b>${T('late')}</div><div class="tile a"><b>${n(a)}</b>${T('absent')}</div></div>
   <h3 class="sub">${T('byCourse')}</h3>${crs}<h3 class="sub">${T('history')}</h3>${hist}${DEMO?`<div class="demo" style="margin-top:14px">${T('attDemo')}</div>`:''}`;
}
function attendanceView(){
  const give=S.attTab==='give';
  return `${hero(give?T('giveAtt'):T('tabMine'), give?T('giveS'):T('mineS'),true)}<div class="wrap stack pull"><a class="qcard" href="${LINKS.attendance}" target="_blank" rel="noopener"><b>${T('attRealT')}</b><span>${T('attRealS')} ${EXT}</span></a><div class="card">
    <div class="seg no-print"><button class="${give?'on':''}" data-act="atab" data-v="give">${T('tabGive')}</button><button class="${!give?'on':''}" data-act="atab" data-v="mine">${T('tabMine')}</button></div>
    ${give?giveView():mineView()}</div>
    <p class="panel-link">${T('teacherQ')} <a href="${LINKS.attendance}" target="_blank" rel="noopener">${T('panel')} ↗</a></p></div>${footer()}`;
}
function panelView(){
  return `${hero(T('panelT'),T('panelS'),true)}<div class="wrap stack pull"><div class="card">
   <form id="panelForm"><label class="lb" for="pe">${T('email')}</label><input class="field" id="pe" type="email" autocomplete="username" required>
   <label class="lb" for="pp">${T('pass')}</label><input class="field" id="pp" type="password" autocomplete="current-password" required>
   <button class="btn" type="submit">${T('login')}</button></form></div></div>${footer()}`;
}

/* ================= RENDER ================= */
const VIEWS={home:homeView,routine:routineView,notices:noticesView,attendance:attendanceView,faculty:facultyView,about:aboutView};
let lastRoute=null;
function route(){ const r=(location.hash||'#/home').replace('#/',''); return VIEWS[r]?r:'home'; }
function render(){
  const r=route(), app=document.getElementById('app');
  app.innerHTML=VIEWS[r]();
  if(r!==lastRoute){ window.scrollTo(0,0); lastRoute=r; }
  document.documentElement.lang=S.lang;
  document.documentElement.setAttribute('data-theme',S.theme);
  document.getElementById('appSub').textContent=T('appSub');
  document.getElementById('langBtn').textContent=T('langBtn');
  document.getElementById('themeBtn').innerHTML = S.theme==='dark'?ICON.sun:ICON.moon;
  document.getElementById('themeBtn').setAttribute('aria-label',T('dark'));
  const active = r==='panel'?'attendance':(r==='faculty'||r==='about')?'home':r;
  document.getElementById('nav').innerHTML = `<div class="wrap">${[['home','home'],['routine','cal'],['notices','bell'],['attendance','check']].map(([k,ic])=>`<a href="#/${k}" class="${active===k?'on':''}">${ICON[ic]}<span>${T(k)}</span></a>`).join('')}</div>`;
  if(r==='attendance' && S.attTab==='give' && S.step===1){ const f=document.querySelector('#pinbox input'); if(f && !('ontouchstart' in window)) f.focus(); }
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function openModal(html){
  const o=document.getElementById('overlay');
  o.innerHTML=`<div class="modal" data-act="closemodal"><div class="sheet">${html}</div></div>`;
}
function closeModal(){ document.getElementById('overlay').innerHTML=''; }

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='closemodal'){ if(e.target===el||e.target.closest('[data-close]')) closeModal(); return; }
  switch(act){
    case 'lang': S.lang=S.lang==='bn'?'en':'bn'; store.set('amc_lang',S.lang); render(); break;
    case 'theme': S.theme=S.theme==='dark'?'light':'dark'; store.set('amc_theme',S.theme); render(); break;
    case 'hyear': S.hYear=+el.dataset.i; render(); break;
    case 'ryear': S.rYear=+el.dataset.i; render(); break;
    case 'rday': S.rDay=+el.dataset.i; render(); break;
    case 'nyear': S.nYear=el.dataset.v; render(); break;
    case 'print': window.print(); break;
    case 'notice': {
      const x=NOTICES.find(v=>v.id===+el.dataset.id); if(!x) break;
      openModal(`<h3>${esc(x.t)}</h3><div class="meta"><span class="tag">${fdate(parse(x.d))}</span>${x.img?`<span class="tag">${T('imgs',n(x.img))}</span>`:''}</div>
        ${!S.live?`<div class="demo" style="margin-top:14px">${T('demoNote')}</div>`:''}
        <div class="actions"><a class="btn sm" href="${esc(x.url||COLLEGE_NOTICE_URL)}" target="_blank" rel="noopener">${T('viewOfficial')}${EXT}</a><button class="btn sm ghost" style="margin-top:0" data-close="1">${T('close')}</button></div>`);
      break; }
    case 'goatt': S.attTab='give'; S.step=1; S.err=''; location.hash='#/attendance'; if(route()==='attendance') render(); break;
    case 'gomine': S.attTab='mine'; S.err=''; break; // href শেষে hashchange রেন্ডার করবে
    case 'atab': S.attTab=el.dataset.v; S.err=''; render(); break;
    case 'pinnext': {
      const pin=[...document.querySelectorAll('#pinbox input')].map(i=>i.value).join('');
      const info=DEMO_PINS[pin];
      if(!info){ S.err=T('wrongPin'); render(); break; }
      S.pinInfo=info; S.session=GROUPS[info.g].session; S.err=''; S.step=2; render(); break; }
    case 'backpin': S.step=1; S.err=''; render(); break;
    case 'confirm': {
      S.session=document.getElementById('sess').value; S.roll=document.getElementById('roll').value.trim();
      const r=parseInt(S.roll,10);
      if(!(r>=1&&r<=300)){ S.err=T('badRoll'); render(); break; }
      if(groupOfSession(S.session)!==S.pinInfo.g){ S.err=T('wrongGroup'); render(); break; }
      const course=GROUPS[S.pinInfo.g].courses[S.pinInfo.course][0], date=iso(new Date());
      const recs=localRecs();
      if(recs.some(x=>x.session===S.session&&+x.roll===r&&x.date===date&&x.course===course)){ S.err=T('dup'); render(); break; }
      recs.push({session:S.session,roll:r,date,course,status:'p'}); store.set('amc_att',recs);
      S.done={roll:r,course}; S.err=''; S.step=3; render(); break; }
    case 'another': S.step=2; S.roll=''; S.err=''; render(); break;
    case 'finish': S.step=1; S.pinInfo=null; S.roll=''; S.err=''; location.hash='#/home'; break;
    case 'showmine': {
      S.mySession=document.getElementById('msess').value; S.myRoll=document.getElementById('mroll').value.trim();
      const r=parseInt(S.myRoll,10);
      if(!(r>=1&&r<=300)){ S.err=T('badRoll'); S.mine=null; render(); break; }
      store.set('amc_mysession',S.mySession); store.set('amc_myroll',S.myRoll);
      S.mine={session:S.mySession,roll:r}; S.err=''; render(); break; }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nsearch'){
    S.nQuery=t.value; const pos=t.selectionStart; render();
    const ni=document.getElementById('nsearch'); ni.focus(); ni.setSelectionRange(pos,pos); return;
  }
  if(t.id==='fsearch'){
    S.fQuery=t.value; const pos=t.selectionStart; render();
    const fi=document.getElementById('fsearch'); fi.focus(); fi.setSelectionRange(pos,pos); return;
  }
  if(t.closest&&t.closest('#pinbox')){
    const boxes=[...document.querySelectorAll('#pinbox input')]; const i=+t.dataset.i;
    const digits=t.value.replace(/\D/g,'');
    if(digits.length>1){ digits.slice(0,4-i).split('').forEach((d,k)=>{ if(boxes[i+k]) boxes[i+k].value=d; }); (boxes[Math.min(i+digits.length,3)]).focus(); }
    else { t.value=digits; if(digits && boxes[i+1]) boxes[i+1].focus(); }
    const full=boxes.every(b=>b.value);
    document.getElementById('pinBtn').disabled=!full;
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target; if(!(t.closest&&t.closest('#pinbox'))) return;
  const boxes=[...document.querySelectorAll('#pinbox input')]; const i=+t.dataset.i;
  if(e.key==='Backspace' && !t.value && boxes[i-1]){ boxes[i-1].focus(); boxes[i-1].value=''; document.getElementById('pinBtn').disabled=true; }
  if(e.key==='Enter' && boxes.every(b=>b.value)) document.getElementById('pinBtn').click();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='panelForm'){ e.preventDefault(); toast(T('panelSoon')); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
window.addEventListener('hashchange',()=>{ closeModal(); if(route()==='attendance'){ /* keep tab */ } render(); });

/* ================= LIVE DATA (স্বয়ংক্রিয় আপডেট) ================= */
function mergeTeachers(live){
  const byId={}; FACULTY.forEach(x=>{ if(x.id) byId[x.id]=x; });
  live.forEach(l=>{ const b=l&&l.id&&byId[l.id];
    if(b){ ['bcs','phone','photo','email'].forEach(k=>{ if(l[k]) b[k]=l[k]; }); if(l.head) b.head=true; }
    else if(l&&l.n&&l.d){ FACULTY.push(l); } });
}
function applyLive(j){
  if(!j) return false;
  let ok=false;
  if(Array.isArray(j.notices)&&j.notices.length){ NOTICES=j.notices.map((x,i)=>({id:x.id||i+1,d:x.d,t:x.t,img:x.img||0,url:x.url})); ok=true; }
  if(Array.isArray(j.teachers)&&j.teachers.length){ mergeTeachers(j.teachers); ok=true; }
  if(Array.isArray(j.routine)&&j.routine.length===GROUPS.length&&typeof j.routineDay==='number'&&j.routine.some(g=>g&&g.length)){
    ROUTINE_BY_DAY[j.routineDay]=j.routine; rebuildClasses(); store.set('amc_rbd',ROUTINE_BY_DAY); ok=true; }
  if(j.stats&&j.stats.years&&j.stats.years.length){ STATS=j.stats; ok=true; }
  if(ok){ S.live=true; S.updatedAt=j.updatedAt||null; }
  return ok;
}
async function loadLive(){
  const cached=store.get('amc_live',null); if(cached && applyLive(cached)) render();
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),9000);
    const r=await fetch(LIVE_API,{signal:ctrl.signal,cache:'no-store'}); clearTimeout(to);
    if(!r.ok) throw new Error('bad status');
    const j=await r.json();
    if(applyLive(j)){ store.set('amc_live',j); render(); }
  }catch(e){ /* সংযোগ না থাকলে সংরক্ষিত তথ্যই দেখানো হবে */ }
}

render();
loadLive();
})();
</script>
</body>
