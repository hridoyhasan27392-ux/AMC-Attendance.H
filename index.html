<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5945e8">
  <meta name="description" content="AMC Economics Department Attendance App">
  <link rel="manifest" href="./manifest.json">
  <title>AMC Economics Attendance</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">🎓 AMC<br><span>অর্থনীতি</span></div>
      <nav class="menu" aria-label="প্রধান মেনু">
        <button class="theme-button" id="themeButton" aria-label="থিম পরিবর্তন">🌙</button>
        <button data-role="admin">⚙️ অ্যাডমিন</button>
        <button data-role="teacher">👨‍🏫 শিক্ষক</button>
        <button data-role="student">🎓 ছাত্র</button>
      </nav>
    </div>
  </header>
  <div id="statusBar" class="status-bar" role="status"></div>
  <main id="main">
    <div class="paper">📝</div>
    <h1>হাজিরা দিন</h1>
    <p class="subtitle">শিক্ষকের দেওয়া ৪-ডিজিটের PIN লিখুন</p>
    <p class="hint">প্রথমে শিক্ষার্থী হিসেবে লগইন করুন, তারপর সেশনের PIN দিয়ে হাজিরা দিন।</p>
    <button class="submit" id="startStudent">শিক্ষার্থী লগইন</button>
  </main>
  <footer>AMC Economics Department<br>Attendance Management System</footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  </script>
</body>
</html>
