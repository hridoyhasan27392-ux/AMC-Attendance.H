<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5945e8">
<meta name="description" content="AMC Economics Department Attendance Management System">
<title>AMC Economics Attendance</title>
<style>
:root{--primary:#5042e9;--text:#202938;--muted:#737d91;--card:#fff;--field:#eef2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,#5145e8,#902fe8,#e43da7)}
header{padding:14px 12px;background:#ffffff20;color:#fff;box-shadow:0 5px 20px #00000010}.topbar{display:flex;align-items:center;gap:10px}.brand{flex:0 0 auto;font-size:19px;font-weight:800;line-height:1.3}
.menu{display:flex;align-items:center;gap:7px;overflow-x:auto;flex:1;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.menu button{flex:0 0 auto;border:0;border-radius:13px;padding:10px 12px;font-size:14px;font-family:inherit;color:white;background:#ffffff30;cursor:pointer}
main{width:min(100% - 24px,650px);margin:30px auto;padding:26px 18px;border-radius:26px;background:var(--card);text-align:center;box-shadow:0 15px 45px #3c136520;min-height:260px}.paper{font-size:60px;line-height:1.25}
h1{margin:6px 0 12px;font-size:clamp(28px,7vw,42px);line-height:1.3;font-weight:800}h2{font-size:22px}.subtitle{margin:0 auto 16px;color:var(--muted);font-size:15px;line-height:1.7}
label{display:block;text-align:left;margin-top:12px;font-weight:650}input,select,textarea{display:block;width:100%;margin:8px 0;padding:13px 12px;border:2px solid #a8b5ff;border-radius:12px;background:var(--field);color:var(--text);font:inherit}textarea{min-height:90px;resize:vertical}
.submit{display:block;width:100%;margin:12px 0;padding:14px 12px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #5042e926}
.secondary{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid #aab2c2;border-radius:12px;background:#f3f4f6;color:#202938;font:inherit;cursor:pointer}.message{margin-top:14px;color:var(--primary);line-height:1.7;overflow-wrap:anywhere}
.hint{margin-top:20px;color:#929bad;font-size:13px;line-height:1.7}.item{padding:12px;margin:9px 0;border:1px solid #e1e5ef;border-radius:12px;text-align:left;overflow-wrap:anywhere}.item p{margin:4px 0}footer{padding:15px;text-align:center;color:white;font-size:12px}
body.dark{--card:#202438;--text:#f4f5ff;--muted:#c0c6d9;--field:#30364e}body.dark .secondary{background:#30364e;color:#f4f5ff;border-color:#59617b}body.dark .item{border-color:#4b526b}
@media(max-width:380px){.brand{font-size:16px}.menu button{padding:9px;font-size:13px}main{padding:22px 14px;margin-top:22px}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand">🎓 AMC<br>অর্থনীতি</div><nav class="menu" aria-label="প্রধান মেনু">
<button id="themeButton" aria-label="থিম পরিবর্তন">🌙</button><button data-page="home">হোম</button><button data-page="admin">অ্যাডমিন</button><button data-page="teacher">শিক্ষক</button><button data-page="student">ছাত্র</button><button data-page="attendance">হাজিরা</button><button data-page="notices">নোটিশ</button>
</nav></div></header>
<main id="main"><div class="paper">📝</div><h1>AMC অর্থনীতি</h1><p class="subtitle">Firebase Attendance Management System</p><p>লোড হচ্ছে…</p></main>
<footer>AMC Economics Department<br>Attendance Management System</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKHvAA6U9FJoOX1F2TYYkXx6Atazl5sxI",
  authDomain: "amc-attendence.firebaseapp.com",
  projectId: "amc-attendence",
  storageBucket: "amc-attendence.firebasestorage.app",
  messagingSenderId: "783387340703",
  appId: "1:783387340703:web:d6cc97a44a0b54027f17aa",
  measurementId: "G-H103G2WZ65"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const main = document.getElementById("main");
const $ = id => document.getElementById(id);
let loggedRole = "", profile = null, currentStudent = null, authReady = false;

const bnDate = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const coll = name => collection(db,name);
const friendlyError = e => {
  const code = e?.code || "";
  const messages = {
    "auth/invalid-credential":"ইমেইল বা পাসওয়ার্ড সঠিক নয়।",
    "auth/user-not-found":"এই ব্যবহারকারী পাওয়া যায়নি।",
    "auth/wrong-password":"পাসওয়ার্ড সঠিক নয়।",
    "auth/email-already-in-use":"এই ইমেইল আগে থেকেই ব্যবহৃত হচ্ছে।",
    "auth/weak-password":"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।",
    "auth/invalid-email":"সঠিক ইমেইল দিন।",
    "permission-denied":"Firestore নিরাপত্তা নিয়ম অনুমতি দেয়নি। Firebase Rules ও ব্যবহারকারীর role যাচাই করুন।",
    "unavailable":"ইন্টারনেট বা Firebase সার্ভারে সমস্যা হয়েছে।"
  };
  return messages[code] || (e?.message || "একটি সমস্যা হয়েছে।");
};
function make(tag, attrs={}, text=""){
  const n=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{if(k==="className")n.className=v;else if(k==="value")n.value=v;else n.setAttribute(k,v)});
  if(text!=="")n.textContent=text;
  return n;
}
function setPage(title, subtitle=""){
  main.replaceChildren(make("div",{className:"paper"},"🎓"),make("h1",{},title));
  if(subtitle) main.append(make("p",{className:"subtitle"},subtitle));
}
function addField(parent,label,id,type="text",required=true,attrs={}){
  parent.append(make("label",{for:id},label));
  const input=make("input",{id,type,...attrs}); input.required=required; parent.append(input); return input;
}
function addArea(parent,label,id){
  parent.append(make("label",{for:id},label));const input=make("textarea",{id});input.required=true;parent.append(input);return input;
}
function addSelect(parent,label,id,options){
  parent.append(make("label",{for:id},label));const s=make("select",{id});
  options.forEach(([value,text])=>s.append(make("option",{value},text)));
  parent.append(s);return s;
}
function addButton(parent,label,fn,cls="submit"){
  const b=make("button",{type:"button",className:cls},label);
  b.addEventListener("click",async()=>{b.disabled=true;try{await fn()}catch(e){alert(friendlyError(e));console.error(e)}finally{b.disabled=false}});
  parent.append(b);return b;
}
function addForm(parent,fn){
  const f=make("form");f.addEventListener("submit",async e=>{e.preventDefault();const b=f.querySelector('button[type="submit"]');if(b)b.disabled=true;try{await fn(f)}catch(err){alert(friendlyError(err));console.error(err)}finally{if(b)b.disabled=false}});
  parent.append(f);return f;
}
function safeText(v){return String(v??"").replace(/[<>]/g,"");}
async function rows(name, constraints=[]){
  const qref=constraints.length?query(coll(name),...constraints):coll(name);
  const snap=await getDocs(qref);return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function removeRow(name,id){await deleteDoc(doc(db,name,id))}
async function addRow(name,data){return addDoc(coll(name),{...data,createdAt:serverTimestamp(),createdBy:auth.currentUser?.uid||null})}
async function userProfile(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  return snap.exists()?{uid:user.uid,...snap.data()}:null;
}
function requireRole(roles){
  if(!auth.currentUser){loginPage("teacher");return false}
  if(!profile || !roles.includes(profile.role)){setPage("⛔ অনুমতি নেই","এই পেজ দেখার অনুমতি আপনার নেই।");addButton(main,"হোমে ফিরুন",home,"secondary");return false}
  return true;
}
function home(){
  setPage("AMC অর্থনীতি","Firebase-ভিত্তিক Attendance Management System");
  addButton(main,"📝 হাজিরা দিন",attendancePage);
  addButton(main,"⚙️ অ্যাডমিন প্যানেল",()=>loginPage("admin"));
  addButton(main,"👨‍🏫 শিক্ষক প্যানেল",()=>loginPage("teacher"));
  addButton(main,"🎓 ছাত্র প্যানেল",()=>loginPage("student"));
  addButton(main,"📢 নোটিশ দেখুন",()=>noticesPage(false));
  if(auth.currentUser) main.append(make("p",{className:"hint"},`লগইন: ${profile?.name||auth.currentUser.email} (${profile?.role||"role সেট করা নেই"})`));
  main.append(make("p",{className:"hint"},"অনলাইন ডেটার জন্য Firebase Authentication ও Firestore ব্যবহৃত হচ্ছে।"));
}
function loginPage(role="teacher"){
  setPage(role==="admin"?"🔐 অ্যাডমিন লগইন":role==="student"?"🎓 ছাত্র লগইন":"👨‍🏫 শিক্ষক লগইন","Firebase Authentication দিয়ে ইমেইল ও পাসওয়ার্ড যাচাই হবে।");
  const f=addForm(main,async f=>{
    const email=f.querySelector("#loginEmail").value.trim(),password=f.querySelector("#loginPassword").value;
    await signInWithEmailAndPassword(auth,email,password);
    const p=await userProfile(auth.currentUser);
    if(!p || p.role!==role){await signOut(auth);throw new Error("এই অ্যাকাউন্টের role নির্বাচিত প্যানেলের সঙ্গে মেলেনি। Firebase users collection-এ সঠিক role সেট করুন।")}
    profile=p;loggedRole=p.role;
    if(role==="admin")adminPage();else if(role==="teacher")teacherPage();else studentPage();
  });
  addField(f,"ইমেইল","loginEmail","email");
  addField(f,"পাসওয়ার্ড","loginPassword","password");
  const submit=make("button",{type:"submit",className:"submit"},"নিরাপদ লগইন");f.append(submit);
  addButton(main,"পাসওয়ার্ড ভুলে গেছেন?","", "secondary").remove();
  addButton(main,"হোমে ফিরুন",home,"secondary");
}
async function logout(){await signOut(auth);profile=null;loggedRole="";currentStudent=null;home()}
function showList(parent,items,format,onDelete,name){
  parent.append(make("h2",{},"তালিকা ("+items.length+")"));
  if(!items.length){parent.append(make("p",{},"এখনো কোনো তথ্য যোগ করা হয়নি।"));return}
  items.forEach(item=>{
    const box=make("div",{className:"item"});box.append(make("p",{},format(item)));
    if(onDelete)addButton(box,"মুছে ফেলুন",async()=>{if(confirm("এই তথ্যটি মুছে ফেলবেন?")){await removeRow(name,item.id);await onDelete()}},"secondary");
    parent.append(box);
  });
}
async function adminPage(){
  if(!requireRole(["admin"]))return;
  setPage("⚙️ অ্যাডমিন প্যানেল","শিক্ষার্থী, সেশন, কোর্স ও রিপোর্ট পরিচালনা");
  const f=addForm(main,async f=>{
    const name=f.querySelector("#sName").value.trim(),roll=f.querySelector("#sRoll").value.trim(),session=f.querySelector("#sSession").value.trim(),email=f.querySelector("#sEmail").value.trim();
    if(!name||!roll||!session)throw new Error("নাম, রোল ও সেশন পূরণ করুন।");
    const duplicate=await rows("students",[where("roll","==",roll),where("session","==",session)]);
    if(duplicate.length)throw new Error("এই সেশনে রোলটি আগে আছে।");
    await addRow("students",{name,roll,session,email,uid:"",active:true});
    await adminPage();
  });
  addField(f,"শিক্ষার্থীর নাম","sName");addField(f,"শিক্ষার্থীর রোল","sRoll");addField(f,"সেশন (যেমন 2024-25)","sSession");addField(f,"শিক্ষার্থীর ইমেইল (ঐচ্ছিক)","sEmail","email",false);
  f.append(make("button",{type:"submit",className:"submit"},"শিক্ষার্থী যোগ করুন"));
  const students=await rows("students");
  showList(main,students,s=>`${s.name} — রোল: ${s.roll} — সেশন: ${s.session}`,adminPage,"students");
  addButton(main,"কোর্স ম্যাপিং",coursesPage,"secondary");addButton(main,"সেশন",sessionsPage,"secondary");
  addButton(main,"রিপোর্ট",()=>reportPage("reports"),"secondary");addButton(main,"নোটিশ পরিচালনা",()=>noticesPage(true),"secondary");
  addButton(main,"নম্বর এন্ট্রি",marksPage,"secondary");addButton(main,"Backup",backupPage,"secondary");
  addButton(main,"লগআউট",logout,"secondary");addButton(main,"হোমে ফিরুন",home,"secondary");
}
async function teacherPage(){
  if(!requireRole(["teacher","admin"]))return;
  setPage("👨‍🏫 শিক্ষক প্যানেল","শিক্ষক কাজের মেনু");
  [["হাজিরা রিপোর্ট",()=>reportPage("reports")],["লাইভ রিপোর্ট",()=>reportPage("live")],["ম্যানুয়াল হাজিরা",manualPage],["নম্বর এন্ট্রি",marksPage],["কোর্স ম্যাপিং",coursesPage],["নোটিশ",()=>noticesPage(true)],["Tracking",()=>reportPage("tracking")],["লগআউট",logout],["হোমে ফিরুন",home]].forEach(([label,fn])=>addButton(main,label,fn));
}
async function studentPage(){
  if(!auth.currentUser||!profile||profile.role!=="student"){loginPage("student");return}
  currentStudent=profile;
  setPage("🎓 ছাত্র প্যানেল",`${profile.name||"শিক্ষার্থী"} — রোল ${profile.roll||"সেট করা নেই"}`);
  addButton(main,"আমার হাজিরা",myAttendance);addButton(main,"আমার কোর্স",myCourses);addButton(main,"নোটিশ",()=>noticesPage(false));addButton(main,"লগআউট",logout,"secondary");
}
async function attendancePage(){
  setPage("📝 হাজিরা দিন","নিরাপদ হাজিরার জন্য শিক্ষার্থীকে নিজের Firebase অ্যাকাউন্টে লগইন করতে হবে।");
  if(!auth.currentUser){addButton(main,"ছাত্র লগইন",()=>loginPage("student"));addButton(main,"শিক্ষক লগইন",()=>loginPage("teacher"),"secondary");return}
  if(!profile){main.append(make("p",{},"এই অ্যাকাউন্টের users/{uid} প্রোফাইল নেই।"));return}
  if(profile.role==="student"){
    addButton(main,"আজকের হাজিরা দিন",async()=>{
      const date=bnDate(), id=`${auth.currentUser.uid}_${date}`;
      const ref=doc(db,"attendance",id);
      await runTransaction(db,async tx=>{
        const existing=await tx.get(ref);if(existing.exists())throw new Error("আজকের হাজিরা ইতিমধ্যে দেওয়া হয়েছে।");
        tx.set(ref,{uid:auth.currentUser.uid,roll:profile.roll||"",name:profile.name||"",session:profile.session||"",date,time:new Date().toLocaleTimeString("bn-BD"),status:"উপস্থিত",createdAt:serverTimestamp()});
      });
      alert("আজকের হাজিরা Firestore-এ সংরক্ষণ হয়েছে।");await studentPage();
    });
  } else if(["teacher","admin"].includes(profile.role)){
    const f=addForm(main,async f=>{
      const roll=f.querySelector("#attRoll").value.trim(),session=f.querySelector("#attSession").value.trim();
      const found=await rows("students",[where("roll","==",roll),where("session","==",session)]);
      if(!found.length)throw new Error("এই রোল ও সেশনের শিক্ষার্থী পাওয়া যায়নি।");
      const s=found[0],date=bnDate(),id=`manual_${s.id}_${date}`;
      await setDoc(doc(db,"attendance",id),{studentId:s.id,uid:s.uid||"",roll:s.roll,name:s.name,session:s.session,date,time:new Date().toLocaleTimeString("bn-BD"),status:"উপস্থিত (শিক্ষক)",createdBy:auth.currentUser.uid,createdAt:serverTimestamp()},{merge:false});
      alert("হাজিরা সংরক্ষণ হয়েছে।");await attendancePage();
    });
    addField(f,"শিক্ষার্থীর রোল","attRoll");addField(f,"সেশন","attSession");f.append(make("button",{type:"submit",className:"submit"},"শিক্ষকের মাধ্যমে হাজিরা"));
  } else main.append(make("p",{},"এই অ্যাকাউন্টে হাজিরা দেওয়ার অনুমতি নেই।"));
  addButton(main,"হোমে ফিরুন",home,"secondary");
}
async function coursesPage(){
  if(!requireRole(["admin","teacher"]))return;
  setPage("📚 কোর্স ম্যাপিং","কোর্স ও শিক্ষকের নাম যোগ করুন");
  const f=addForm(main,async f=>{await addRow("courses",{course:f.querySelector("#courseName").value.trim(),teacher:f.querySelector("#courseTeacher").value.trim(),session:f.querySelector("#courseSession").value.trim()});await coursesPage()});
  addField(f,"কোর্সের নাম","courseName");addField(f,"শিক্ষকের নাম","courseTeacher");addField(f,"সেশন","courseSession");f.append(make("button",{type:"submit",className:"submit"},"কোর্স যোগ করুন"));
  showList(main,await rows("courses"),x=>`${x.course} — শিক্ষক: ${x.teacher} — ${x.session}`,coursesPage,"courses");
  addButton(main,"ফিরে যান",()=>profile?.role==="admin"?adminPage():teacherPage(),"secondary");
}
async function sessionsPage(){
  if(!requireRole(["admin"]))return;setPage("📅 সেশন পরিচালনা");
  const f=addForm(main,async f=>{const value=f.querySelector("#sessionName").value.trim();const all=await rows("sessions",[where("name","==",value)]);if(!all.length)await addRow("sessions",{name:value});await sessionsPage()});
  addField(f,"নতুন সেশন (যেমন 2024-25)","sessionName");f.append(make("button",{type:"submit",className:"submit"},"সেশন যোগ করুন"));
  showList(main,await rows("sessions"),x=>x.name,sessionsPage,"sessions");addButton(main,"ফিরে যান",adminPage,"secondary");
}
async function noticesPage(canEdit){
  setPage("📢 নোটিশ বোর্ড");
  if(canEdit&&requireRole(["admin","teacher"])){
    const f=addForm(main,async f=>{await addRow("notices",{title:f.querySelector("#noticeTitle").value.trim(),body:f.querySelector("#noticeBody").value.trim(),date:bnDate()});await noticesPage(true)});
    addField(f,"নোটিশের শিরোনাম","noticeTitle");addArea(f,"বিস্তারিত","noticeBody");f.append(make("button",{type:"submit",className:"submit"},"নোটিশ প্রকাশ করুন"));
  }
  const all=await rows("notices");showList(main,all,x=>`${x.title} — ${x.body} (${x.date||""})`,canEdit?()=>noticesPage(true):null,"notices");
  addButton(main,"হোমে ফিরুন",home,"secondary");
}
async function reportPage(kind){
  if(!requireRole(["admin","teacher"]))return;
  const records=await rows("attendance");
  setPage(kind==="live"?"📈 লাইভ রিপোর্ট":kind==="tracking"?"🔎 Tracking":"📊 হাজিরা রিপোর্ট","Firestore-এ সংরক্ষিত হাজিরা");
  const today=bnDate(),list=kind==="live"?records.filter(r=>r.date===today):records;
  showList(main,list,r=>`${r.date||""} ${r.time||""} — ${r.name||""} (${r.roll||""}) — ${r.status||""}`);
  addButton(main,"CSV রিপোর্ট ডাউনলোড",()=>{
    const rowsCsv=[["তারিখ","সময়","নাম","রোল","সেশন","অবস্থা"],...list.map(r=>[r.date,r.time,r.name,r.roll,r.session,r.status])];
    const csv="\uFEFF"+rowsCsv.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
    download("amc-report.csv",csv,"text/csv;charset=utf-8");
  });
  addButton(main,"ফিরে যান",()=>profile?.role==="admin"?adminPage():teacherPage(),"secondary");
}
async function manualPage(){
  if(!requireRole(["admin","teacher"]))return;setPage("✍️ ম্যানুয়াল হাজিরা");
  const f=addForm(main,async f=>{const roll=f.querySelector("#manualRoll").value.trim(),session=f.querySelector("#manualSession").value.trim();
    const found=await rows("students",[where("roll","==",roll),where("session","==",session)]);if(!found.length)throw new Error("এই রোল ও সেশনের শিক্ষার্থী পাওয়া যায়নি।");
    const s=found[0],date=bnDate();await addRow("attendance",{studentId:s.id,uid:s.uid||"",roll:s.roll,name:s.name,session:s.session,date,time:new Date().toLocaleTimeString("bn-BD"),status:"উপস্থিত (ম্যানুয়াল)"});await reportPage("reports")});
  addField(f,"শিক্ষার্থীর রোল","manualRoll");addField(f,"সেশন","manualSession");f.append(make("button",{type:"submit",className:"submit"},"হাজিরা যোগ করুন"));
  addButton(main,"ফিরে যান",teacherPage,"secondary");
}
async function marksPage(){
  if(!requireRole(["admin","teacher"]))return;setPage("🧮 নম্বর এন্ট্রি");
  const f=addForm(main,async f=>{await addRow("marks",{roll:f.querySelector("#markRoll").value.trim(),session:f.querySelector("#markSession").value.trim(),subject:f.querySelector("#markSubject").value.trim(),mark:Number(f.querySelector("#markValue").value)});await marksPage()});
  addField(f,"শিক্ষার্থীর রোল","markRoll");addField(f,"সেশন","markSession");addField(f,"বিষয়","markSubject");addField(f,"প্রাপ্ত নম্বর","markValue","number");f.append(make("button",{type:"submit",className:"submit"},"নম্বর সংরক্ষণ"));
  showList(main,await rows("marks"),x=>`রোল ${x.roll} (${x.session}) — ${x.subject}: ${x.mark}`,null,"marks");addButton(main,"ফিরে যান",()=>profile?.role==="admin"?adminPage():teacherPage(),"secondary");
}
async function myAttendance(){
  if(!auth.currentUser||!profile||profile.role!=="student"){loginPage("student");return}
  setPage("📊 আমার হাজিরা",`${profile.name||""} — রোল ${profile.roll||""}`);
  const all=await rows("attendance",[where("uid","==",auth.currentUser.uid)]);
  showList(main,all,r=>`${r.date} — ${r.status}`);main.append(make("p",{},`মোট হাজিরা: ${all.length}`));addButton(main,"ফিরে যান",studentPage,"secondary");
}
async function myCourses(){
  if(!profile||profile.role!=="student"){loginPage("student");return}
  setPage("📚 আমার কোর্স",`${profile.name||""} — রোল ${profile.roll||""}`);
  const all=await rows("courses");showList(main,all,c=>`${c.course} — শিক্ষক: ${c.teacher} — ${c.session||""}`);addButton(main,"ফিরে যান",studentPage,"secondary");
}
function download(name,content,type){
  const url=URL.createObjectURL(new Blob([content],{type}));const a=make("a",{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function backupPage(){
  if(!requireRole(["admin"]))return;setPage("💾 Backup","Firestore তথ্য JSON ফাইলে ডাউনলোড");
  addButton(main,"ব্যাকআপ ডাউনলোড",async()=>{
    const data={};for(const k of ["students","attendance","sessions","notices","courses","marks"])data[k]=await rows(k);
    download("amc-backup.json",JSON.stringify(data,null,2),"application/json");
  });
  main.append(make("p",{className:"hint"},"এই সংস্করণে JSON ফাইল থেকে স্বয়ংক্রিয় restore বন্ধ রাখা হয়েছে, যাতে অনিচ্ছাকৃতভাবে অনলাইন ডেটা overwrite না হয়।"));
  addButton(main,"ফিরে যান",adminPage,"secondary");
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{
  const p=b.dataset.page;
  if(p==="home")home();else if(p==="admin"||p==="teacher"||p==="student")loginPage(p);else if(p==="attendance")attendancePage();else if(p==="notices")noticesPage(false);
}));
$("themeButton").addEventListener("click",()=>{document.body.classList.toggle("dark");$("themeButton").textContent=document.body.classList.contains("dark")?"☀️":"🌙"});
onAuthStateChanged(auth,async user=>{
  try{
    if(user){profile=await userProfile(user);loggedRole=profile?.role||"";}
    else{profile=null;loggedRole="";currentStudent=null;}
    authReady=true;home();
  }catch(e){setPage("Firebase সংযোগ সমস্যা",friendlyError(e));addButton(main,"আবার চেষ্টা করুন",home)}
});
function homeIfReady(){if(authReady)home()}
</script>
</body>
</html>
