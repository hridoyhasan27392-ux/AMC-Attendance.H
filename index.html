
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c2c">
  <meta name="description" content="AMC Economics Attendance Management System">
  <title>AMC Attendance</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>AMC Attendance</h1>
      <p>অর্থনীতি বিভাগ, আনন্দ মোহন কলেজ</p>
    </div>
    <button id="themeBtn" type="button" aria-label="থিম পরিবর্তন">
      🌙
    </button>
  </header>

  <main class="container">
    <div id="setupNotice" class="notice hidden" role="alert"></div>

    <section id="loginCard" class="card">
      <h2>লগইন</h2>
      <p>আপনার অনুমোদিত অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p>

      <form id="loginForm">
        <label for="email">ইমেইল</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">পাসওয়ার্ড</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">লগইন করুন</button>
        <p id="loginMsg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="app" class="hidden">
      <div class="card">
        <h2 id="welcomeTitle">স্বাগতম</h2>
        <p id="userLine"></p>
        <button id="logoutBtn" type="button">লগআউট</button>
      </div>

      <nav id="nav" aria-label="প্রধান মেনু"></nav>

      <section id="view" class="card" aria-live="polite">
        <p>লোড হচ্ছে…</p>
      </section>
    </section>
  </main>

  <footer class="app-footer">
    <p>AMC Attendance · Economics Department</p>
  </footer>

  <!-- Firebase SDK: app.js-এর আগে লোড হতে হবে -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- প্রথমে Firebase Config, তারপর অ্যাপের JavaScript -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
